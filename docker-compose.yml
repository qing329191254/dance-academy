services:
  mysql:
    image: mysql:8.0
    container_name: forget-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD_required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dance_academy}
      TZ: Asia/Shanghai
    volumes:
      - academy-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ./server
    container_name: forget-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 80
      MYSQL_ADDRESS: ${MYSQL_ADDRESS:-mysql:3306}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD_required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dance_academy}
      TZ: Asia/Shanghai
      WX_APPID: ${WX_APPID:?WX_APPID_required}
      WX_SECRET: ${WX_SECRET:?WX_SECRET_required}
      WX_SUBSCRIBE_TEMPLATE_ID: ${WX_SUBSCRIBE_TEMPLATE_ID:-}
      WX_MP_STATE: ${WX_MP_STATE:-formal}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_required}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME_required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD_required}
      UPLOAD_DIR: /app/uploads
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - academy-uploads:/app/uploads

volumes:
  academy-uploads:
  academy-mysql:
